---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: coder-database
spec:
  interval: 1h
  path: ./kubernetes/apps/<cluster>/productivity/coder/database
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: productivity
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: coder
spec:
  dependsOn:
    - name: coder-database
  interval: 1h
  path: ./kubernetes/apps/<cluster>/productivity/coder/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: productivity
  wait: false
