---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sillytavern
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: sillytavern
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    httpRoute:
      enabled: true
      parentRefs:
        - name: envoy-internal
          namespace: network
      hostnames:
        - sillytavern.example.com
    persistence:
      enabled: true
      size: 10Gi
    livenessProbe:
      exec:
        command: ["sh", "-c", "node", "src/healthcheck.js"]
      initialDelaySeconds: 15
      periodSeconds: 5
      failureThreshold: 2
    readinessProbe:
      exec:
        command: ["sh", "-c", "node", "src/healthcheck.js"]
      initialDelaySeconds: 20
      periodSeconds: 5
      failureThreshold: 5
    sillytavern:
      enableUserAccounts: true
      defaultUser:
        existingSecret:
          name: sillytavern-secrets
          key: admin-password
      enableDiscreetLogin: true
      sso:
        aithentikAuth: true
        trustedProxies:
          - 10.42.0.0/16
          - 10.43.0.0/16
      hostWhiteList:
        enabled: true
        hosts:
          - sillytavern.example.com
      privateAddressWhitelist:
        allowedRanges:
          - "192.168.1.0/24"
