---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sillytavern
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: sillytavern
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    httpRoute:
      enabled: true
      parentRefs:
        - name: envoy-internal
          namespace: network
      hostnames:
        - sillytavern.example.com
    persistence:
      enabled: true
      size: 8Gi
    config:
      basicAuthMode: "false"
      hostWhitelist:
        enabled: "true"
        hosts:
          - sillytavern.example.com
      sso:
        authentikAuth: "true"
        trustedProxies:
          - 10.43.0.0/16
          - 10.42.0.0/16
      enableUserAccounts: "true"
      enableDiscreetLogin: "true"
