---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vaultwarden
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: vaultwarden
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      vaultwarden:
        type: deployment
        replicas: 1
        strategy: Recreate
        annotations:
          secret.reloader.stakater.com/reload: tls-vaultwarden
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/controller: adguard
                  app.kubernetes.io/name: *app
        containers:
          app:
            image:
              repository: docker.io/vaultwarden/server
              tag: 1.37.2
            envFrom:
              - configMapRef:
                  name: vaultwarden-env
              - secretRef:
                  name: vaultwarden-secrets
            env:
              - name: DATABASE_URL
                secretKeyRef:
                  name: vaultwarden-db-app
                  key: uri
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 80
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              startup:
                enabled: false
    service:
      app:
        forceRename: *app
        controller: vaultwarden
        ports:
          http:
            port: 80
    route:
      main:
        hostnames:
          - "vaultwarden.sud0.net"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      main:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 32Gi
        globalMounts:
          - path: /data
