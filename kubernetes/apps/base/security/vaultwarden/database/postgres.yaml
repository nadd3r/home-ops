apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vaultwarden-db
spec:
  instances: 3
  bootstrap:
    initdb:
      database: vaultwarden-db
      owner: vaultwarden
  storage:
    storageClass: local-path
    size: 64Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 50m
    limits:
      memory: 1Gi
      cpu: 500m
