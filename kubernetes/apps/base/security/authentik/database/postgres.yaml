apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db
spec:
  instances: 3
  bootstrap:
    initdb:
      database: authentik-db
      owner: authentik
  storage:
    storageClass: local-path
    size: 64Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 50m
    limits:
      memory: "500Mi"
      cpu: 200m
