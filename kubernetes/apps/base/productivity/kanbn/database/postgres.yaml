apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kanbn-db
spec:
  instances: 3
  bootstrap:
    initdb:
      database: kanbn-db
      owner: kanbn
  storage:
    storageClass: local-path
    size: 32Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 50m
    limits:
      memory: 1Gi
      cpu: 500m
