---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanbn-database
spec:
  interval: 1h
  path: ./kubernetes/apps/<cluster>/productivity/kanbn/database
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: productivity
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanbn
spec:
  dependsOn:
    - name: kanbn-database
  interval: 1h
  path: ./kubernetes/apps/<cluster>/productivity/kanbn/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: productivity
  wait: false
