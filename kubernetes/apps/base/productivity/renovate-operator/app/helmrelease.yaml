apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  interval: 1h
  values:
    metrics:
      dashboard:
        enabled: true
        grafanaDashboard:
          allowCrossNamespaceImport: true
          folder: apps
          instanceSelector:
            matchLabels:
              dashboards: grafana
      enabled: true
      serviceMonitor:
        enabled: true
    route:
      annotations:
        external-dns.alpha.kubernetes.io/internal: "true"
      enabled: true
      hostnames:
        - renovate.example.com
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https
    webhook:
      enabled: true
