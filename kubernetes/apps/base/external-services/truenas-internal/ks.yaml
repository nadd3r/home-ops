---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: truenas-internal
spec:
  interval: 1h
  path: ./kubernetes/apps/<cluster>/external-services/truenas-internal/external
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: external-services
  wait: true
