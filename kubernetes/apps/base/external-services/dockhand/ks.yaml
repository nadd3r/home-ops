---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dockhand
spec:
  interval: 1h
  path: ./kubernetes/apps/<cluster>/external-services/dockhand/external
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: external-services
  wait: true
