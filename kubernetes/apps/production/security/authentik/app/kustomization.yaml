---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../base/security/authentik/app
  - ./externalsecret.yaml

patches:
  - target:
      kind: HelmRelease
      name: authentik
    path: ./helmrelease.yaml
  - target:
      kind: HTTPRoute
      name: authentik
    path: ./httproute.yaml
