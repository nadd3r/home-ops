---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/security/authentik/ks.yaml

patches:
  - target:
      kind: Kustomization
      name: authentik
    patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/apps/production/security/authentik/app
  - target:
      kind: Kustomization
      name: authentik-database
    patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/apps/production/security/authentik/database
