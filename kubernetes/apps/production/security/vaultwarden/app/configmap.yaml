apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultwarden-env
data:
  DOMAIN: https://vaultwarden.sud0.net
  SSO_AUTHORITY: https://authentik.sud0.net/application/o/vaultwarden/
  SIGNUPS_ALLOWED: "false"
  PUSH_ENABLED: "true"
  IP_HEADER: X-Forwarded-For
  TRASH_AUTO_DELETE_DAYS: "7"
  SSO_ENABLED: "true"
  SSO_SCOPES: openid email profil offline_access
  SSO_ONLY: "true"
  SSO_SIGNUPS_MATCH_EMAIL: "true"
  SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION: "false"
  SMTP_TIMEOUT: "15"
  SMTP_PORT: "465"
  SMTP_SECURITY: force_tls
