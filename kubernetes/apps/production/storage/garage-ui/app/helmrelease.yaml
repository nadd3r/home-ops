---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app garage-ui
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: garage-ui
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    route:
      main:
        hostnames:
          - "garageui.sud0.net"