---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/default/echo/ks.yaml

patches:
  - target:
      kind: Kustomization
      name: echo
    patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/apps/production/default/echo/app
