apiVersion: v1
kind: ConfigMap
metadata:
  name: open-webui-env
data:
  # OIDC Settings
  OAUTH_PROVIDER_NAME: authentik
  OPENID_PROVIDER_URL: https://authentik.sud0.net/application/o/open-webui/.well-known/openid-configuration
  OPENID_REDIRECT_URI: https://open-webui.sud0.net/oauth/oidc/callback
  WEBUI_URL: https://open-webui.sud0.net
  ENABLE_OAUTH_SIGNUP: "true"
  OAUTH_SCOPES: "openid email profile roles"
  ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
  ENABLE_LOGIN_FORM: "false"
  ENABLE_PASSWORD_CHANGE_FROM: "false"
  ENABLE_PASSWORD_AUTH: "false"
  OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"

  # Open WebUI Settings
  DEFAULT_MODELS: Qwen3.6-35B-A3B-UD-Q8_K_XL
  DEFAULT_USER_ROLE: "user"
  RESPONSE_WATERMARK: "This response is AI generated. Please verify the information before taking any action."
  ENV: prod
  WEBUI_NAME: AID0
  LOG_FORMAT: json
  ENABLE_OLLAMA_API: "false"
  OPENAI_API_BASE_URL: http://192.168.20.10:8080/v1
  ENABLE_WEB_SEARCH: "true"
