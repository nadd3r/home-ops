---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sillytavern
spec:
  values:
    httpRoute:
      hostnames:
        - sillytavern.sud0.net
    sillytavern:
      enableDiscreetLogin: true
      hostWhiteList:
        hosts:
          - sillytavern.sud0.net
      privateAddressWhitelist:
        allowedRanges:
          - "192.168.20.0/24"
