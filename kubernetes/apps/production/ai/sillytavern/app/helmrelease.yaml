---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sillytavern
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: sillytavern
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    httpRoute:
      hostnames:
        - sillytavern.sud0.net
    config:
      hostWhitelist:
        hosts:
          - sillytavern.sud0.net
