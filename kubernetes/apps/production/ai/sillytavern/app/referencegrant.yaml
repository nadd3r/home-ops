apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-sillytavern-authentik-outpost
  namespace: security
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: ai
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: ai
  to:
    - group: ""
      kind: Service
      name: ak-outpost-authentik-embedded-outpost
