apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-oidc-secrets
spec:
  refreshInterval: 10s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: coder-oidc-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CODER_OIDC_CLIENT_ID
      remoteRef:
        key: secrets/coder/coder/oidc-secrets
        property: CODER_OIDC_CLIENT_ID
    - secretKey: CODER_OIDC_CLIENT_SECRET
      remoteRef:
        key: secrets/coder/coder/oidc-secrets
        property: CODER_OIDC_CLIENT_SECRET
