---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/coder/coder/ks.yaml

patches:
  - target:
      kind: Kustomization
      name: coder
    patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/apps/production/coder/coder/app
  - target:
      kind: Kustomization
      name: coder-database
    patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/apps/production/coder/coder/database
