---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/observability/gatus/ks.yaml

patches:
  - target:
      kind: Kustomization
      name: gatus-sidecar
    patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/infrastructure/production/observability/gatus/sidecar
