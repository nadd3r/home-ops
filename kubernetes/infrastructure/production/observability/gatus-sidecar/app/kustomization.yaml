---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../base/observability/gatus-sidecar/app

patches:
  - target:
      kind: HelmRelease
      name: gatus-sidecar
    path: ./helmrelease.yaml

configMapGenerator:
  - name: gatus-sidecar-configmap
    files:
      - config.yaml=./resources/config.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
