---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../base/flux-system/flux-instance/app

patches:
  - target:
      kind: HTTPRoute
      name: flux-webhook
    path: ./httproute.yaml
  - target:
      kind: HelmRelease
      name: flux-instance
    path: ./helmrelease.yaml
