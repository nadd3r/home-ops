---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../base/flux-system/flux-instance/app

patches:
  - patch: |
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: flux-webhook
      spec:
        hostnames:
        - flux-webhook.sud0.net
  - patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: flux-instance
      spec:
        values:
          instance:
            sync:
              url: ssh://git@gitlab.com/nadd3r/home-ops.git
