kind: Kustomization
resources:
  - ../../../base/flux-system/flux-instance/ks.yaml

patches:
  - patch: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: flux-instance
      spec:
        path: ./kubernetes/infrastructure/production/flux-system/flux-instance/app
