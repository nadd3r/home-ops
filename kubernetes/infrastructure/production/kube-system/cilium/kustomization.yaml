---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/kube-system/cilium/ks.yaml

patches:
  - target:
      kind: Kustomization
      name: cilium
    patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/infrastructure/production/kube-system/cilium/app
