---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../base/kube-system/cilium/app

patches:
  - target:
      kind: CiliumLoadBalancerIPPool
      name: pool
    path: ./pool.yaml
  - target:
      kind: CiliumBGPClusterConfig
      name: bgp-cluster-config
    path: ./bgpclusterconfig.yaml
