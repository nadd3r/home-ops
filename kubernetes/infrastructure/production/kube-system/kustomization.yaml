---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system

resources:
  - ./namespace.yaml
  - ./cilium/
  - ./coredns/

patches:
  - target:
      kind: Kustomization
      name: cloudflare-tunnel
    patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/infrastructure/production/network/cloudflare-tunnel/app
