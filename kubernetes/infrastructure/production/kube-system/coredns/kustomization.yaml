---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/kube-system/coredns/ks.yaml

patches:
  - target:
      kind: Kustomization
      name: coredns
    patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/infrastructure/production/kube-system/coredns/app
