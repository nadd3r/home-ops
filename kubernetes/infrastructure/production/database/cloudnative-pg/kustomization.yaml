---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/database/cloudnative-pg/ks.yaml

patches:
  - target:
      kind: Kustomization
      name: cloudnative-pg
    patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/infrastructure/production/database/cloudnative-pg/app
