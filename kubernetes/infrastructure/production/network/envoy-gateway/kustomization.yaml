---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/network/envoy-gateway/ks.yaml

patches:
  - target:
      kind: Kustomization
      name: envoy-gateway
    patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/infrastructure/production/network/envoy-gateway/app
