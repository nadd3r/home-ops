---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/network/cloudflare-dns/ks.yaml

patches:
  - target:
      kind: Kustomization
      name: cloudflare-dns
    patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/infrastructure/production/network/cloudflare-dns/app
