---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/external-secrets/openbao/ks.yaml

patches:
  - target:
      kind: Kustomization
      name: openbao
    patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/infrastructure/production/external-secrets/openbao/app
