---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/external-secrets/external-secrets/ks.yaml

patches:
  - target:
      kind: Kustomization
      name: external-secrets
    patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/infrastructure/production/external-secrets/external-secrets/app
