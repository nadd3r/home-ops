---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: adguard
spec:
  secretName: tls-adguard
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: dns.example.com
  dnsNames:
    - dns.example.com
    - adguard.example.com
  privateKey:
    rotationPolicy: Always
