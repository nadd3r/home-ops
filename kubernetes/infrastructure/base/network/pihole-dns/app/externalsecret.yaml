apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pihole-dns-secret
spec:
  refreshInterval: 10s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: pihole-dns-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: EXTERNAL_DNS_PIHOLE_PASSWORD
      remoteRef:
        key: secrets/network/pihole-dns/password
        property: EXTERNAL_DNS_PIHOLE_PASSWORD
