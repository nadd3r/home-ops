---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "example-production"
spec:
  dnsNames:
    - "example.com"
    - "*.example.com"
  duration: 160h
  issuerRef:
    name: cloudflare
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
  secretName: "example-production-tls"
  usages:
    - digital signature
