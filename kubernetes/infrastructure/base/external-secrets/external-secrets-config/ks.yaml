---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-config
spec:
  dependsOn:
    - name: external-secrets
  interval: 1h
  path: ./kubernetes/infrastructure/<cluster>/external-secrets/external-secrets-config/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: external-secrets
  wait: false
