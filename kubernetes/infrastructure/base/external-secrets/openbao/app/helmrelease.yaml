---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
spec:
  chartRef:
    kind: OCIRepository
    name: openbao
  interval: 1h
  values:
    global:
      tlsDisable: true
    injector:
      enabled: false
    csi:
      enabled: false
    server:
      ha:
        enabled: true
        replicas: 3
        raft:
          enabled: true
          setNodeID: true
          config: |
            ui = true

            listener "tcp" {
              tls_disable = 1
              address = "[::]:8200"
              cluster_address = "[::]:8201"
            }

            storage "raft" {
              path = "/openbao/data"
            }

            service_registration "kubernetes" {}

            seal "transit" {
              address = "https://bao.example.com"
              key_name = "openbao-unseal"
              mount_path = "transit/"
              tls_skip_verify = "false"
            }
      dataStorage:
        enabled: true
        size: 10Gi
        storageClass: local-path
        accessMode: ReadWriteOnce

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi

      extraSecretEnvironmentVars:
        - envName: VAULT_TOKEN
          secretName: openbao-transit-token
          secretKey: token

      gateway:
        httpRoute:
          enabled: True
          hosts:
            - bao.example.com
          parentRefs:
            - name: envoy-internal
              namespace: network
              sectionName: https

    ui:
      enabled: true
