---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
spec:
  chartRef:
    kind: OCIRepository
    name: openbao
  interval: 1h
  values:
    global:
      tlsDisable: true
    injector:
      enabled: false
    csi:
      enabled: false
    server:
      ha:
        enabled: true
        replicas: 3

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi

      extraEnvironmentVars:
        PGHOST: openbao-db-cluster-pooler-rw
        PGPORT: "5432"
        PGDATABASE: openbao-db
        PGSSLMODE: disable

      extraSecretEnvironmentVars:
        - envName: VAULT_TOKEN
          secretName: openbao-transit-token
          secretKey: token
        - envName: PGUSER
          secretName: openbao-db-cluster-app
          secretKey: username
        - envName: PGPASSWORD
          secretName: openbao-db-cluster-app
          secretKey: password

      gateway:
        httpRoute:
          enabled: True
          hosts:
            - openbao.example.com
          parentRefs:
            - name: envoy-internal
              namespace: network
              sectionName: https

    ui:
      enabled: true
