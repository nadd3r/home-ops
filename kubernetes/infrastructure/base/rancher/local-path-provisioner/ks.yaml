---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-path-provisioner
spec:
  interval: 1h
  path: ./kubernetes/infrastructure/<cluster>/rancher/local-path-provisioner/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: rancher
  wait: false
