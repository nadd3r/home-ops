---
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

endpoints:
  - name: Cloudflare
    group: connectivity
    url: icmp://1.1.1.1
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Google
    group: connectivity
    url: icmp://8.8.8.8
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Quad9
    group: connectivity
    url: icmp://9.9.9.9
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

metrics: true

storage:
  type: sqlite
  caching: true
  path: ${GATUS_CONFIG_PATH}/gatus.db

ui:
  title: Status | Gatus
  header: Status
  logo: https://secure.gravatar.com/avatar/7636c08277c2791c6f95aa9e3e18fb3a277943ec3e668c3b355c5484e5e06a4e?s=80&d=identicon
  link: https://gitlab.com/nadd3r
  buttons:
    - name: Gitlab
      link: https://gitlab.com/nadd3r
    - name: Homelab
      link: https://gitlab.com/nadd3r/home-ops

web:
  port: ${GATUS_WEB_PORT}
