---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatus-sidecar
spec:
  interval: 1h
  path: ./kubernetes/infrastructure/<cluster>/observability/gatus-sidecar/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: true
