---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  chartRef:
    kind: OCIRepository
    name: cert-manager
  interval: 1h
  values:
    crds:
      enabled: true
    replicaCount: 2
    dns01RecursiveNameservers: https://1.1.1.1:443/dns-query,https://1.0.0.1:443/dns-query
    dns01RecursiveNameserversOnly: true
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
    resources:
      requests:
        cpu: 1m
        memory: 100Mi
      limits:
        cpu: 5m
        memory: 200Mi
    webhook:
      resources:
        requests:
          cpu: 1m
          memory: 20Mi
        limits:
          cpu: 5m
          memory: 50Mi
    cainjector:
      resources:
        requests:
          cpu: 2m
          memory: 75Mi
        limits:
          cpu: 5m
          memory: 150Mi
