apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-external
  annotations:
    external-dns.kubernetes.io/target: external.tsud0.net
spec:
  infrastructure:
    annotations:
      external-dns.kubernetes.io/hostname: external.tsud0.net
      lbipam.cilium.io/ips: "192.168.22.211"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: tsud0-testing-tls
