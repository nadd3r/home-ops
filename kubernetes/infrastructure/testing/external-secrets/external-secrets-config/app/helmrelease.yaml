---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets-config
spec:
  chartRef:
    kind: OCIRepository
    name: external-secrets-config
  interval: 1h
  values:
    openbao:
      provider:
        vault:
          auth:
            kubernetes:
              mountPath: kubernetes
              role: external-secrets
              serviceAccountRef:
                name: external-secrets
                namespace: external-secrets
          path: kv
          server: http://openbao:8200
          version: v2
