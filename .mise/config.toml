[env]
FLATE_PATH = '{{config_root}}/kubernetes/flux/cluster'
KUBECONFIG = '{{config_root}}/kubeconfig'
TALOSCONFIG = '{{config_root}}/talosconfig'
JUST_UNSTABLE = "1"

[hooks]
postinstall = "lefthook install"

[tools]
actionlint = "1.7.12"
jq = "1.8.2"
just = "1.58.0"
lefthook = "2.1.10"
node = "26.7.0"
oxfmt = "0.63.0"
shellcheck = "0.11.0"
talos = "1.12.11"
yq = "4.53.3"
zizmor = "1.29.0"
