[env]
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
FLATE_PATH = '{{config_root}}/kubernetes/flux/cluster'
KUBECONFIG = '{{config_root}}/kubeconfig'
TALOSCONFIG = '{{config_root}}/talosconfig'
JUST_UNSTABLE = "1"

[hooks]
postinstall = "lefthook install"

[tools]
actionlint = "1.7.12"
age = "1.3.1"
cloudflared = "2026.8.2"
flux2 = "2.9.4"
gum = "0.17.0"
helm = "4.2.4"
helmfile = "1.7.4"
jq = "1.8.2"
just = "1.58.0"
k9s = "0.51.0"
kubeconform = "0.8.0"
kubectl = "1.36.3"
kustomize = "5.8.1"
lefthook = "2.1.10"
node = "26.7.0"
openbao = "2.6.1"
oxfmt = "0.63.0"
shellcheck = "0.11.0"
sops = "3.13.3"
talos = "1.12.11"
"github:postfinance/topf" = "0.5.0"
vals = "0.46.0"
yq = "4.53.3"
zizmor = "1.29.0"
