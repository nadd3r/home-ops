[env]
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
FLATE_PATH = '{{config_root}}/kubernetes/flux/cluster'
KUBECONFIG = '{{config_root}}/kubeconfig'
TALOSCONFIG = '{{config_root}}/talosconfig'
JUST_UNSTABLE = "1"

[hooks]
postinstall = "lefthook install"

[tools]
actionlint = "1.7.12"
age = "1.3.2"
cloudflared = "2026.10.4"
flux2 = "2.10.0"
gum = "0.17.0"
helm = "4.3.1"
helmfile = "1.8.2"
jq = "1.8.2"
just = "1.59.0"
k9s = "0.51.0"
kubeconform = "0.8.0"
kubectl = "1.37.1"
kustomize = "5.8.3"
lefthook = "2.2.2"
node = "26.12.1"
openbao = "v2.7.1"
oxfmt = "0.68.0"
shellcheck = "0.11.0"
sops = "3.13.3"
talos = "1.14.5"
"github:postfinance/topf" = "0.6.2"
vals = "0.46.1"
yq = "4.54.1"
zizmor = "1.31.1"
